<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
body{font-family: Arial; margin: 20px;}
.box{padding: 15px; border: 1px solid #ccc; border-radius: 8px; max-width: 650px;}
button{padding: 10px 15px; margin: 6px 0; cursor: pointer;}
#popover{ display:none; position: absolute; background: #222; color:#fff; padding:10px; border-radius: 6px;
width: 220px; }
#apiData{margin-top: 12px; background:#f7f7f7; padding:10px; border-radius:6px;}
</style>
</head>
<body>
<h1>Experiment 3: JavaScript + AJAX</h1>
<div class="box">
<button onclick="showAlert()">Show Alert</button>
<button id="popBtn">Show Popover</button>
<div id="popover">Hello! This is a popover message.</div>
<button onclick="loadData()">Fetch API Data (AJAX)</button>
<div id="apiData">
<b>API Output:</b>
<p id="result">Click "Fetch API Data" to load user.</p>
</div>
</div>

<script>
function showAlert(){
alert("Welcome! Alert triggered successfully.");

}
var popBtn = document.getElementById("popBtn"); var
popover = document.getElementById("popover");
popBtn.onclick = function(e) {
if (popover.style.display === "none" || popover.style.display === "") { popover.style.display =
"block";
popover.style.left = (e.pageX + 10) + "px";
popover.style.top = (e.pageY + 10) + "px";
} else {
popover.style.display = "none";
}
};
function loadData() {
var result = document.getElementById("result");
result.innerHTML = "Loading data...";
var xhr = new XMLHttpRequest();
xhr.open("GET", "https://jsonplaceholder.typicode.com/users/1", true);
xhr.onreadystatechange = function() {
if (xhr.readyState === 4 && xhr.status === 200) { var
data = JSON.parse(xhr.responseText);
result.innerHTML =
"<p><b>Name:</b> " + data.name + "</p>" +
"<p><b>Email:</b> " + data.email + "</p>" +
"<p><b>City:</b> " + data.address.city + "</p>" +
"<p><b>Company:</b> " + data.company.name + "</p>";
}
};
xhr.send();
}
</script>
</body>
</html>
